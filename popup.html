<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FACEIT Ping</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">FACEIT PING</div>
      <div id="host-status" class="status-indicator online">Хост активен</div>
    </div>

    <div class="card">
      <div class="card-title">Текущий сервер</div>
      <div class="row">
        <span class="label">IP сервера:</span>
        <span id="current-ip" class="val">Не обнаружен</span>
      </div>
      <div class="row">
        <span class="label">Хостинг:</span>
        <span id="current-provider" class="val">--</span>
      </div>
      <div class="row">
        <span class="label">Пинг:</span>
        <span id="current-ping" class="val highlight">-- мс</span>
      </div>
      <div class="row">
        <span class="label">Потери:</span>
        <span id="current-loss" class="val">0%</span>
      </div>
      <div class="row">
        <span class="label">Статус:</span>
        <span id="current-status" class="val status-tag">Ожидание</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Ручная проверка</div>
      <div class="input-group">
        <input type="text" id="manual-ip" placeholder="92.223.103.98:27033" />
        <button id="btn-manual-check">Замер</button>
      </div>
    </div>

    <div class="actions">
      <button id="btn-refresh-last" class="action-btn">Обновить</button>
      <button id="btn-trace-last" class="action-btn secondary">Маршрут</button>
      <button id="btn-copy-ip" class="action-btn secondary">Копия IP</button>
    </div>

    <!-- Блок трассировки -->
    <div id="popup-trace-box" class="trace-box hidden">
      <div class="trace-header">
        <span>Детальный маршрут узлов</span>
        <span id="popup-trace-close" class="trace-close">x</span>
      </div>
      <div id="popup-trace-list" class="trace-list">
        <div class="trace-loading">Загрузка...</div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
